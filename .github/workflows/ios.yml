# App iOS no GitHub Actions (macOS), sem conta paga da Apple.
#
#   device      (a cada push e manual) compila para iPhone (Release, iosArm64) sem assinatura e
#               publica o .ipa -> artefato iosApp-device-ipa (assinar e instalar com o Sideloadly
#               e um Apple ID gratuito; veja iosApp/README.md).
#   simulator   (manual, opção "simulator") compila para o Simulador, roda o app e tira capturas
#               -> artefatos ios-screenshots e iosApp-simulator.
#   testflight  (manual, opção "testflight") assina e envia ao TestFlight; precisa da conta paga
#               e dos segredos (veja iosApp/README.md).
name: iOS

on:
  push:
    branches: [ccr-39509bf5-h1xt7c]
  workflow_dispatch:
    inputs:
      simulator:
        description: "Também rodar no Simulador e tirar capturas"
        type: boolean
        default: false
      testflight:
        description: "Assinar e enviar ao TestFlight (precisa da conta paga e dos segredos)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_PATH: build/ios-device/Build/Products/Release-iphoneos/iosApp.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Versões
        run: |
          sw_vers
          xcodebuild -version
          java -version

      - name: Gerar o projeto do Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Compilar para aparelho (Release, sem assinatura)
        run: |
          mkdir -p build
          # O passo de build do projeto chama ./gradlew :renderer:embedAndSignAppleFrameworkForXcode.
          if ! xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios-device \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > build/xcodebuild-device.log 2>&1; then
            echo "::group::Erros"
            grep -nE "error:|e: |FAILURE|What went wrong" build/xcodebuild-device.log | head -n 80 || true
            echo "::endgroup::"
            tail -n 120 build/xcodebuild-device.log
            exit 1
          fi
          tail -n 5 build/xcodebuild-device.log

      - name: Conferir que o binário é de aparelho (iosArm64)
        run: |
          echo "Tarefas do Kotlin/Native no build:"
          grep -oE ":renderer:[A-Za-z]*Ios(Simulator)?Arm64[A-Za-z]*" build/xcodebuild-device.log | sort -u
          grep -qE ":renderer:link[A-Za-z]*FrameworkIosArm64" build/xcodebuild-device.log \
            || { echo "O framework Kotlin não foi gerado para iosArm64"; exit 1; }
          echo "Arquiteturas: $(lipo -archs "$APP_PATH/iosApp")"
          xcrun vtool -show-build "$APP_PATH/iosApp" | tee build/vtool.txt
          [ "$(lipo -archs "$APP_PATH/iosApp")" = "arm64" ] || { echo "Esperava só arm64"; exit 1; }
          grep -qE "platform IOS$" build/vtool.txt || { echo "Esperava a plataforma IOS (aparelho)"; exit 1; }

      - name: Empacotar o .ipa (sem assinatura)
        run: |
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry iosApp-unsigned.ipa Payload)
          ls -la build/iosApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-device-ipa
          path: build/iosApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-device-log
          path: build/xcodebuild-device.log
          if-no-files-found: ignore

  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.simulator
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.fabianofranca.sdui.ios
      APP_PATH: build/ios/Build/Products/Debug-iphonesimulator/iosApp.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Gerar o projeto do Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Compilar para o Simulador
        run: |
          mkdir -p build
          if ! xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/ios \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              build > build/xcodebuild.log 2>&1; then
            echo "::group::Erros"
            grep -nE "error:|e: |FAILURE|What went wrong" build/xcodebuild.log | head -n 80 || true
            echo "::endgroup::"
            tail -n 120 build/xcodebuild.log
            exit 1
          fi
          tail -n 5 build/xcodebuild.log

      - name: Rodar no Simulador e tirar capturas
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS")[-1])]
          for runtime in sorted((r for r in devices if "iOS" in r), key=version, reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(sorted(phones, key=lambda d: d["name"])[0]["udid"]); break
          ')
          echo "Simulador: $UDID"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP_PATH"
          mkdir -p screenshots

          capture() { # rota, nome
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            SIMCTL_CHILD_SDUI_START_ROUTE="$1" xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 20 # carga da tela no BFF e das imagens
            xcrun simctl io "$UDID" screenshot "screenshots/$2.png"
          }
          capture home home
          capture catalog catalog
          capture settings settings
          xcrun simctl ui "$UDID" appearance dark
          capture settings settings-dark
          capture home home-dark

          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'process == "iosApp"' > screenshots/app.log 2>&1 || true
          grep -iE "sdui|error|exception" screenshots/app.log | tail -n 40 || true
          ls -la screenshots

      - name: Empacotar o .app do Simulador
        run: ditto -c -k --keepParent "$APP_PATH" build/iosApp-simulator.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-simulator
          path: build/iosApp-simulator.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-simulator-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  # Assinatura e envio ao TestFlight. Precisa da conta paga do Apple Developer Program e destes
  # segredos no repositório (Settings > Secrets and variables > Actions):
  #   APPLE_TEAM_ID                  o Team ID (10 caracteres)
  #   IOS_DIST_CERT_P12_BASE64       o certificado "Apple Distribution" (.p12) em base64
  #   IOS_DIST_CERT_PASSWORD         a senha do .p12
  #   IOS_PROFILE_BASE64             o perfil de provisionamento App Store (.mobileprovision) em base64
  #   ASC_KEY_ID, ASC_ISSUER_ID      a chave da API do App Store Connect (Users and Access > Integrations)
  #   ASC_KEY_P8_BASE64              o arquivo .p8 dessa chave, em base64
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: device
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Conferir os segredos
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$P12" ] || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$PROFILE" ] || missing="$missing IOS_PROFILE_BASE64"
          [ -n "$ASC_KEY" ] || missing="$missing ASC_KEY_P8_BASE64"
          [ -z "$missing" ] || { echo "Faltam os segredos:$missing (veja iosApp/README.md)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Instalar o certificado e o perfil
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Gerar o projeto do Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Arquivar (assinado)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Exportar o .ipa (App Store)
        run: |
          sed -e "s/TEAM_ID/$APPLE_TEAM_ID/" -e "s/PROFILE_UUID/$PROFILE_UUID/" \
            iosApp/ExportOptions-AppStore.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Enviar ao TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f build/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iosApp-appstore-ipa
          path: build/export/*.ipa
